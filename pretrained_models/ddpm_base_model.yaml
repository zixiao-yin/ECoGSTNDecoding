# Model configuration for ddpm_base_model.pt

dataset:
  signal_length: 1000
  val_split_ratio: 0.2
network:
  signal_channel: 1
  cond_dim: 3
  hidden_channel: 256
  in_kernel_size: 3
  out_kernel_size: 3
  slconv_kernel_size: 6
  num_scales: 5
  num_blocks: 4
  num_off_diag: 2
  use_pos_emb: true
  padding_mode: circular
  use_fft_conv: true
diffusion:
  diffusion_steps: 1000
  schedule: quad
  start_beta: 0.0001
  end_beta: 0.02
diffusion_kernel:
  sigma_squared: 1.0
  ell: 0.1
optimizer:
  num_epochs: 50
  train_batch_size: 1024
  lr: 0.00012
  weight_decay: 0.0001
  early_stopping_patience: 5
